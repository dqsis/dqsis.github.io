<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commonplace Book — Quotes, Anecdotes & Passages</title>
  <link rel="stylesheet" href="../styles/style.css" />
  <link rel="stylesheet" href="commonplace/commonplace.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--stone);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Header — align shared site-header to this page's content width */
    .site-header {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 40px;
    }

    /* Hero */
    .hero {
      padding: 56px 40px 32px;
      max-width: 760px;
      margin: 0 auto;
    }
    .hero-label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .hero h1 {
      font-family: var(--font-hero);
      font-size: 2.6rem;
      line-height: 1.12;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .hero p {
      color: var(--olive);
      font-size: 0.95rem;
      max-width: 520px;
    }

    /* Filter bar */
    .filter-bar {
      max-width: 760px;
      margin: 0 auto 36px;
      padding: 0 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      padding: 5px 14px;
      border: 1px solid var(--sand);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--ink);
      color: var(--stone);
      border-color: var(--ink);
    }

    /* Entries */
    .entries {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    /* Entry card styles (.entry, .passage, .source, .reflection, .tag, …)
       live in commonplace/commonplace.css so the index and every
       generated permalink page share one definition. */

    /* Empty state */
    .empty {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 40px 80px;
      text-align: center;
      color: var(--olive);
      font-style: italic;
      display: none;
    }

    /* Footer */
    .page-footer {
      text-align: center;
      padding: 32px;
      font-size: 0.72rem;
      color: var(--olive);
      border-top: 1px solid var(--sand);
    }

    @media (max-width: 600px) {
      .site-header, .hero, .filter-bar, .entries, .empty { padding-left: 20px; padding-right: 20px; }
      .hero h1 { font-size: 1.95rem; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <a href="https://dqsis.com" class="site-logo">
    <img src="../images/groupworkout_icon.png" alt="DQSIS logo">
    <span class="site-logo-name">DQSIS<span class="site-logo-sub">Dimitrios Kiousis</span></span>
  </a>
  <span class="site-nav">Experiments</span>
</header>

<!-- Hero -->
<div class="hero">
  <div class="hero-label">A Commonplace Book</div>
  <h1>Passages &amp;<br />Marginalia</h1>
  <p>Quotes, anecdotes, and passages I have read or come upon — kept here with a note on why each one stayed with me.</p>
</div>

<!-- Filter bar -->
<div class="filter-bar" id="filterBar"></div>

<!-- Entries -->
<div class="entries" id="entries"></div>
<div class="empty" id="empty">Nothing filed under this theme yet.</div>

<footer class="page-footer">DQSIS · A commonplace book · kept and annotated by Dimitrios Kiousis</footer>

<script>
/* ------------------------------------------------------------------
   Entries live in commonplace/entries.json (one shared source of
   data), not inline here — that file also feeds the standalone
   permalink page generated for each entry by
   scripts/generate-commonplace-pages.js. To add an entry:
     1. Add a new object at the TOP of the array in entries.json
        (entries are shown newest-first). Give it a unique "slug"
        (short, url-safe, e.g. "same-river-twice").
     2. Run: node scripts/generate-commonplace-pages.js
        to build its permalink page at experiments/commonplace/<slug>.html.
   Fields: kind, title, quote (wraps passage in “ ” if true), passage,
   source, reflection — all support "\n\n" for paragraph breaks and
   inline HTML (<em>, <a href>) — plus tags, which become filter buttons.
   ------------------------------------------------------------------ */
const entriesEl = document.getElementById('entries');
const emptyEl = document.getElementById('empty');
const filterBar = document.getElementById('filterBar');

function paragraphs(text) {
  return text.split('\n\n').map(p => `<p>${p}</p>`).join('');
}

async function init() {
  const entries = await (await fetch('commonplace/entries.json')).json();

  entries.forEach(e => {
    const el = document.createElement('article');
    el.className = 'entry';
    el.id = `entry-${e.slug}`;
    el.dataset.tags = e.tags.join(',');
    el.innerHTML = `
      <div class="entry-head">
        <div class="entry-kind">${e.kind}</div>
        <a class="permalink" href="commonplace/${e.slug}.html">Permalink →</a>
      </div>
      <h2 class="entry-title">${e.title}</h2>
      <div class="passage${e.quote ? ' quote' : ''}">${paragraphs(e.passage)}</div>
      <div class="source">${e.source}</div>
      <div class="reflection-label">Note</div>
      <div class="reflection">${paragraphs(e.reflection)}</div>
      <div class="entry-tags">${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    entriesEl.appendChild(el);
  });

  /* ---------------------- filters ---------------------- */
  const allTags = [...new Set(entries.flatMap(e => e.tags))].sort();
  const tags = ['all', ...allTags];

  tags.forEach((tag, i) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (i === 0 ? ' active' : '');
    btn.dataset.tag = tag;
    btn.textContent = tag === 'all' ? 'All' : tag;
    filterBar.appendChild(btn);
  });

  filterBar.addEventListener('click', ev => {
    const btn = ev.target.closest('.filter-btn');
    if (!btn) return;
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const tag = btn.dataset.tag;
    let visible = 0;
    document.querySelectorAll('.entry').forEach(entry => {
      const show = tag === 'all' || entry.dataset.tags.split(',').includes(tag);
      entry.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    emptyEl.style.display = visible === 0 ? 'block' : 'none';
  });

  /* Jump to a specific entry when the URL carries #entry-<slug>,
     e.g. arriving from a permalink page's "back to full list" link. */
  if (location.hash) {
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView({ block: 'start' });
  }
}

init();
</script>
</body>
</html>
